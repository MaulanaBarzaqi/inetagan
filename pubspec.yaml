name: inetagan
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.1.4
  cupertino_icons: ^1.0.8
  d_info: ^0.2.2
  d_input: ^2.0.0
  d_method: ^0.2.6
  dartz: ^0.10.1
  equatable: ^2.0.7
  extended_image: ^10.0.1
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^19.4.2
  flutter_spinkit: ^5.2.1
  flutter_svg: ^2.2.0
  freezed_annotation: ^3.1.0
  gap: ^3.0.1
  get_it: ^8.0.3
  go_router: ^16.2.1
  google_fonts: ^4.0.4
  http: ^1.4.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  smooth_page_indicator: ^1.2.1
  bloc: ^9.0.1
  freezed: ^3.2.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.6.0
  flutter_gen_runner: ^5.11.0
  go_router_builder: ^4.0.1
  flutter_launcher_icons: ^0.14.4

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  image_path: "assets/icons/logo_foreground.png"
  android: true 
  ios: false     
  web:
    generate: false 
  windows:
    generate: false 
  macos:
    generate: false 

  adaptive_icon_foreground: "assets/icons/logo_foreground.png"
  adaptive_icon_background: "assets/icons/logo_background.png" 
